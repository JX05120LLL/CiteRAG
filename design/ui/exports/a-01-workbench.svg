ht="400" text-anchor="start">请确认设备型号是 X100，再按顺序检查。</text><text x="355" y="409" font-size="13" fill="#666666" font-weight="400" text-anchor="start">1</text><text x="383" y="409" font-size="16" fill="#171717" font-weight="400" text-anchor="start">合上纸仓盖，确认盖子完全关闭。</text><text x="355" y="449" font-size="13" fill="#666666" font-weight="400" text-anchor="start">2</text><text x="383" y="449" font-size="16" fill="#171717" font-weight="400" text-anchor="start">查看屏幕，提示消失后再继续使用。</text><text x="355" y="489" font-size="13" fill="#666666" font-weight="400" text-anchor="start">3</text><text x="383" y="489" font-size="16" fill="#171717" font-weight="400" text-anchor="start">如果仍有提示，停止操作并联系设备维护人员。</text><rect x="765" y="473" width="23" height="22" rx="5" fill="#F5F5F4"/><text x="776.5" y="489" font-size="12" fill="#171717" font-weight="500" text-anchor="middle">2</text><rect x="352" y="516" width="244" height="36" rx="18" fill="#F5F5F4"/><g transform="translate(366 525.0) scale(0.75)" stroke="#171717" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h6"/></g><text x="392" y="539.0" font-size="14" fill="#171717" font-weight="500" text-anchor="start">X100 使用手册.pdf</text><rect x="610" y="516" width="238" height="36" rx="18" fill="#FFFFFF" stroke="#E4E4E4" stroke-width="1"/><g transform="translate(624 525.0) scale(0.75)" stroke="#171717" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8M8 16h6"/></g><text x="650" y="539.0" font-size="14" fill="#171717" font-weight="500" text-anchor="start">日常维护指南.docx</text><rect x="352" y="565" width="808" height="164" rx="12" fill="#F7F7F6"/><text x="375" y="597" font-size="14" fill="#171717" font-weight="500" text-anchor="start">引用 1 · 故障提示与排查</text><g transform="translate(1117 583) scale(0.7083333333333334)" stroke="#666666" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d