[project]
name = "citerag-backend"
version = "0.1.0"
description = "CiteRAG M0 application API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
rag = [
  "lightrag-hku @ git+https://github.com/HKUDS/LightRAG.git@59af311307c7417b342f44850b097648d47e83bd",
  "pgvector>=0.4,<0.5",
]
voice = [
    "livekit-api==1.2.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: isolated PostgreSQL integration test; requires explicit test database URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
