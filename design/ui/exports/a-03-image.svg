="#171717" font-weight="400" text-anchor="start">日常保养注意事项</text><text x="26" y="579" font-size="12" fill="#666666" font-weight="400" text-anchor="start">设备维护记录</text><g transform="translate(24 866) scale(0.625)" stroke="#666666" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10h12v11H6ZM8 10V6a4 4 0 0 1 8 0v4M12 15v2"/></g><text x="48" y="879" font-size="12" fill="#666666" font-weight="400" text-anchor="start">聊天与附件仅自己可见</text><path d="M24 904L208 904" stroke="#E4E4E4" stroke-width="1" fill="none"/><g transform="translate(24 925) scale(0.75)" stroke="#666666" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h6a4 4 0 0 1 3 2 4 4 0 0 1 3-2h6v15h-6a4 4 0 0 0-3 2 4 4 0 0 0-3-2H3ZM12 6v15"/></g><text x="54" y="940" font-size="13" fill="#171717" font-weight="400" text-anchor="start">浏览知识库</text><g transform="translate(185 925) scale(0.625)" stroke="#666666" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></g><text x="352" y="144" font-size="12" fill="#666666" font-weight="400" text-anchor="start">你 · 已添加 1 张演示图片</text><text x="352" y="192" font-size="27" fill="#171717" font-weight="500" text-anchor="start">帮我确认型号，并查一下 E102。</text><rect x="352" y="230" width="346" height="224" rx="12" fill="#F5F5F4"/><rect x="372" y="250" width="306" height="184" rx="8" fill="#E0E1DF" stroke="#D1D1CE" stroke-width="1"/><rect x="387" y="266" width="276" height="152" rx="3" fill="#FCFCFA" stroke="#C7C8C4" stroke-width="1"/><text x="405" y="299" font-size="14" fill="#242424" font-weight="600" text-anchor="start">LABEL PRINTER</text><path d="M405 316L645 316" stroke="#C7C8C4" stroke-width="1" fill="none"/><text x="405" y="349" font-size="22" fill="#242424" font-weight="600" text-anchor="start">型号  X100</text><rect x="604" y="329" width="37" height="24" rx="3" fill="#DFE0DC"/><text x="405" y="381" font-size="12" fill="#686868" font-weight="400" text-anchor="